  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

24px\">\n<div>\n<h2 class=\"h3\">Objetivos del taller<\u002Fh2>\n<div class=\"outline\">Construir una visión compartida del ecosistema de plataformas de Capital Humano que permita a formadores y colaboradores operar con autonomía, de manera seamless.<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<p class=\"p\"><span><\u002Fspan><span><\u002Fspan><span style=\"white-space: pre-wrap\">Operar con autonomía y de forma fluida no surge por casualidad; requiere construir juntos una visión compartida.<\u002Fspan><br><span style=\"white-space: pre-wrap\"> Esa visión es la que traemos al Workshop <span style=\"font-weight: bold\">Experience Lab:<\u002Fspan> un espacio para idear y experimentar como en un laboratorio, donde buscamos la mejor fórmula para diseñar la experiencia de vida del colaborador. <\u002Fspan><br><span style=\"white-space: pre-wrap\">Vamos a explorar bajo qué principios de autonomía se regirá la experiencia, a conocer cuál podría ser la mejor forma de vivirla y a descubrir cómo todo esto se verá reflejado de manera fluida y autónoma en el ecosistema digital con el que interactúan.<\u002Fspan><\u002Fp>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h2 class=\"h3\" style=\"margin-top: 40px\">Contexto<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px\">\n<div>\n<h3 class=\"h4\">Cliente<\u002Fh3>\n<div class=\"outline\">Capital Humano<\u002Fdiv>\n<h3 class=\"h4\" style=\"margin-top: 16px\">Fecha · Hora · Lugar/Sala<\u002Fh3>\n<div class=\"outline\">Viernes 23 de octubre de 9:00 am a 2:00 pm<br>Universidad de la Libertad Sala 13, Piso 3<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h3 class=\"h4\">Nu. de personas<\u002Fh3>\n<div class=\"outline\">40 personas<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h3 class=\"h4\">Temática del taller<\u002Fh3>\n<div class=\"outline\">Experience Lab. Los participantes son parte de una experiencia como especialista que tratan de descubrir cual es la fórmula para diseñar la nueva experiencia del colaborador.&nbsp;<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- EQUIPO -->\n<section id=\"equipo\" class=\"sec\">\n<h2 class=\"h2\">Nuestro equipo<\u002Fh2>\n<p style=\"font-family: 'Sora', sans-serif; font-weight: 600; font-size: clamp(18px, 2.4vw, 24px); line-height: 1.4; margin: 0 0 32px; max-width: 860px\">Como equipo somos los encargados de llevar el taller, <span style=\"color: {{accent}}\">estar en escucha activa, observar lo que hacen los participantes, tomar notas de los insights<\u002Fspan> y al mismo tiempo, <span style=\"color: {{accent}}\">fomentar la participación<\u002Fspan>.<\u002Fp>\n\n<h3 class=\"h3\">Staff<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 20px 12px; margin-bottom: 32px\">\n<div style=\"display: flex; flex-direction: column; align-items: center\"><div aria-hidden=\"true\" style=\"width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(180deg, #9BE33F 0%, #1FC98A 100%)\"><\u002Fdiv><div class=\"who\">Ma.Fer<br>Domínguez<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\"><img class=\"ava\" src=\"bc3efcd6-9232-436b-8993-24c9de1040a5\" alt=\"Caro Arámbula\"><div class=\"who\">Caro<br>Arámbula<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\"><img class=\"ava\" src=\"fc74891e-7592-46d3-becc-d1f68f97f382\" alt=\"Tere Aguilar\"><div class=\"who\">Tere<br>Aguilar<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\"><img class=\"ava\" src=\"d061ac2b-f850-4183-91b3-7e2e5ed37fbe\" alt=\"Adri Martínez\"><div class=\"who\">Adri<br>Martínez<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\"><img class=\"ava\" src=\"0784d523-5cfc-4d4f-b5e5-3fd41749e91e\" alt=\"Yun Sánchez\"><div class=\"who\">Yun<br>Sánchez<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\"><img class=\"ava\" src=\"1c4de95e-005f-4c0b-ac1f-8470b3c181ef\" alt=\"Yisus\"><div class=\"who\">Yisus<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\"><img class=\"ava\" src=\"e21408c9-0811-4576-b352-374c3c0e352f\" alt=\"Pao Toledo\"><div class=\"who\">Pao<br>Toledo<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 28px\">\n<div>\n<h3 class=\"h3\">CEO<\u002Fh3>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"b44eb8ec-5ac5-4c61-942c-4b5691f9527d\" alt=\"Mike Flores\"><div class=\"who\">Mike<br>Flores<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h3 class=\"h3\">Marketing<\u002Fh3>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"90fa9727-4507-4fe5-90d6-88e4c3138f99\" alt=\"Abi Acosta\"><div class=\"who\">Abi<br>Acosta<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"c8c40f7b-13dc-4354-a272-5b9be508255e\" alt=\"Charlie Villegas\"><div class=\"who\">Charlie<br>Villegas<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"1ea9b519-0a88-4b93-a5b2-1bdfedc3cdbf\" alt=\"Dani Lorelle\"><div class=\"who\">Dani<br>Lorelle<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h3 class=\"h3\">Diseño y facilitación<\u002Fh3>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"f69290bb-1622-4e73-8587-b911a94e33af\" alt=\"Caro Quintal\"><div class=\"who\">Caro<br>Quintal<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h3 class=\"h3\">Backstage<\u002Fh3>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"20cb2dc7-1f80-43ce-8d17-54dcfcc4f403\" alt=\"Fer Barcienas\"><div class=\"who\">Fer<br>Barcienas<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"c8b6abd6-4748-42e7-ac94-99e745879eac\" alt=\"Fer Gallardo\"><div class=\"who\">Fer<br>Gallardo<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- LLEGADA -->\n<section id=\"llegada\" class=\"sec\">\n<h2 class=\"h2\">Previo al taller y logística de llegada<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; margin-bottom: 16px\">\n<div class=\"card\">\n<h3 class=\"h3\">Dress code<\u002Fh3>\n<ul class=\"ul\"><li>Blusa/camisa color blanca y jeans · medianamente formal<\u002Fli><\u002Ful>\n<h3 class=\"h3\" style=\"margin-top: 20px\">Acceso y hora de llegada<\u002Fh3>\n<ul class=\"ul\">\n<li>Mostrar QR Zeus (por entrada peatonal).<\u002Fli>\n<li>Mostrar el folio de entrada (los que solicitaron lugar de estacionamiento).<\u002Fli>\n<li>Les pedimos puntualidad para la llegada.<\u002Fli>\n<\u002Ful>\n<div style=\"display: flex; flex-direction: column; gap: 8px; margin-top: 14px\">\n<div style=\"display: flex; gap: 12px; align-items: baseline\"><span class=\"chip time\" style=\"flex-shrink: 0\">8:40 am<\u002Fspan><span class=\"small\" style=\"color: #1A1A1A\">Llegada de <b>Fer B., Caro Quintal, Pao, Abi y Charlie<\u002Fb>.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: baseline\"><span class=\"chip time\" style=\"flex-shrink: 0\">9:00 am<\u002Fspan><span class=\"small\" style=\"color: rgb(26, 26, 26)\">Universidad de la Libertad, <b>Piso 3 · Sala 1<\u002Fb>, todos los demás.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\">\n<h3 class=\"h3\">Material adicional<\u002Fh3>\n<div style=\"display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center\">\n<div aria-hidden=\"true\" style=\"width: 44px; height: 44px; border-radius: 50%; border: 2px solid #FFFFFF; box-sizing: border-box; background: linear-gradient(180deg, #9BE33F 0%, #1FC98A 100%)\"><\u002Fdiv>\n<img class=\"ava-s\" src=\"bc3efcd6-9232-436b-8993-24c9de1040a5\" alt=\"Caro Arámbula\">\n\n<img class=\"ava\" src=\"0784d523-5cfc-4d4f-b5e5-3fd41749e91e\" alt=\"Yun Sánchez\" style=\"width: 47px; height: 47px\"><img class=\"ava-s\" src=\"d061ac2b-f850-4183-91b3-7e2e5ed37fbe\" alt=\"Adri Martínez\">\n<span class=\"small\">Ma.Fer, Caro Arámbula, Yun y Adri Martínez<\u002Fspan>\n<\u002Fdiv>\n<ul class=\"ul\">\n<li>Asegurar tener acceso de edición a los Figmas o archivos<br>Casos de éxito presentación en Claude y Flujos de momentos de vida del Colaborador.<\u002Fli>\n<li>Llevar computadora cargada, desbloqueada y sin contraseña.<\u002Fli><li>Si tienen iPad u otro dispositivo llevarlo cargado y sin contraseña de bloqueo.<\u002Fli>\n<\u002Ful>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h3 class=\"h3\" style=\"margin-top: 28px\">¿Qué tengo que hacer cuando llegue?<\u002Fh3>\n<p class=\"small\" style=\"margin: 0 0 14px\">Marca cada tarea al terminarla.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px\">\n<div class=\"card\">\n<div style=\"display: flex; gap: 10px; align-items: center; margin-bottom: 8px\"><img class=\"ava-s\" src=\"20cb2dc7-1f80-43ce-8d17-54dcfcc4f403\" alt=\"\"><h4 class=\"h4\" style=\"margin: 0\">Fer Barcienas<\u002Fh4><\u002Fdiv>\n<label class=\"check\"><input type=\"checkbox\">Acomodo de mesas y poner material, distintivos de mesa, gafetes y manteles.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Conexión de pantallas y proyección de presentación (correrla toda con clicker).<\u002Flabel>\n<\u002Fdiv>\n\n<div class=\"card\">\n<div style=\"display: flex; gap: 10px; align-items: center; margin-bottom: 8px\"><img class=\"ava-s\" src=\"e21408c9-0811-4576-b352-374c3c0e352f\" alt=\"\"><h4 class=\"h4\" style=\"margin: 0\">Pao Toledo<\u002Fh4><\u002Fdiv>\n<label class=\"check\"><input type=\"checkbox\">Acomodar la mesa de recepción.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Tener los folletos listos de un lado.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\"><span>Tener las etiquetas de los participantes en orden alfabético.<\u002Fspan><\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\"><span>Tener plumón para poner nombre a las etiquetas en caso de que no esté el nombre en la lista.<\u002Fspan><\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\"><span>Estar pendiente de los participantes y decirles que la entrada es hasta las 9:50 am.<\u002Fspan><\u002Flabel><label class=\"check\"><input type=\"checkbox\"><span>La lista de participantes la puedes encontrar en la pestaña de \"Participantes\"<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<div class=\"card\">\n<div style=\"display: flex; gap: 10px; align-items: center; margin-bottom: 8px\"><img class=\"ava-s\" src=\"c8c40f7b-13dc-4354-a272-5b9be508255e\" alt=\"\"><h4 class=\"h4\" style=\"margin: 0\">Charlie<\u002Fh4><\u002Fdiv>\n<label class=\"check\"><input type=\"checkbox\"><span>Hacer tomas del backstage, ej. ver guía <a href=\"#backstage\">“Contenido recomendado backstage”<\u002Fa>.<\u002Fspan><\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Entrevistar a los participantes sobre las expectativas del taller.<\u002Flabel>\n<\u002Fdiv>\n<div class=\"card\">\n<div style=\"display: flex; gap: 10px; align-items: center; margin-bottom: 8px\"><img class=\"ava-s\" src=\"fc74891e-7592-46d3-becc-d1f68f97f382\" alt=\"Tere\"><img class=\"ava\" src=\"0784d523-5cfc-4d4f-b5e5-3fd41749e91e\" alt=\"Yun Sánchez\" style=\"width: 47px; height: 47px\"><h4 class=\"h4\" style=\"margin: 0\">Tere y Yun<\u002Fh4><\u002Fdiv>\n<label class=\"check\"><input type=\"checkbox\"><span>Revisar que todos los materiales&nbsp;estén acomodados en la mesa de staff.<\u002Fspan><\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\"><span>Pegar el cartel principal en la puerta principal.<\u002Fspan><\u002Flabel>\n\n<\u002Fdiv><div class=\"card\">\n<div style=\"display: flex; gap: 10px; align-items: center; margin-bottom: 8px\"><img class=\"ava-s\" src=\"bc3efcd6-9232-436b-8993-24c9de1040a5\" alt=\"Caro A.\" style=\"margin-left: -16px\"><img class=\"ava\" src=\"0784d523-5cfc-4d4f-b5e5-3fd41749e91e\" alt=\"Yun Sánchez\" style=\"width: 47px; height: 47px\"><img class=\"ava-s\" src=\"d061ac2b-f850-4183-91b3-7e2e5ed37fbe\" alt=\"Adri\" style=\"margin-left: -16px\"><h4 class=\"h4\" style=\"margin: 0\">Ma.Fer, Caro A. y Adri<\u002Fh4><\u002Fdiv>\n\n\n<label class=\"check\"><input type=\"checkbox\"><span>Colocar post-its y marcadores en las mesas.<\u002Fspan><\u002Flabel><label class=\"check\"><input type=\"checkbox\"><span>Colocar los distintivos de los participantes en sus mesas.<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- RECEPCION -->\n<section id=\"recepcion\" class=\"sec\">\n<h2 class=\"h2\">Recepción de participantes<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px\">\n<div class=\"card\">\n<h3 class=\"h3\">¿A qué hora pueden pasar?<\u002Fh3>\n<p class=\"p\">Los participantes podrán entrar a la sala hasta las <b>9:50 am<\u002Fb> (Check-In con Pao).<\u002Fp>\n<p class=\"p\" style=\"color: {{accent}}; font-weight: 700\">El WS empieza a las 10:05 aprox.<\u002Fp>\n<h3 class=\"h3\" style=\"margin-top: 20px\">¿Cómo es la experiencia?<\u002Fh3>\n<p class=\"p\">Los participantes llegan, suben a la sala y los recibe un banner de bienvenida del Workshop.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 12px\">\n<div class=\"role\" style=\"background: #FDF0F4\"><b style=\"color: #B547C5\">Antes de que entren a la sala<\u002Fb><strong>Pao:<\u002Fstrong> dar los gafetes de nombres mientras los participantes están en la sala de espera.<br><strong>Fer:<\u002Fstrong> pone música de ambientación.<\u002Fdiv>\n<div class=\"role\" style=\"background: #FDF0F4\"><b style=\"color: #B547C5\">Cuando entran los participantes<\u002Fb><strong>Pao:<\u002Fstrong> les da la bienvenida y les da el folleto del cronograma.<br><strong>Staff:<\u002Fstrong> identifica cuál es la mesa en la que está asignado(a) el participante y lo acompaña (según la <a href=\"#mesas\">lista de asientos<\u002Fa>).<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\">\n<h3 class=\"h3\">Materiales de recepción<\u002Fh3>\n<p class=\"small\" style=\"margin: 0 0 6px\">Asegúrate de contar con todo:<\u002Fp>\n<label class=\"check\"><input type=\"checkbox\">Folletos de bienvenida<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\"><span><a href=\"Participantes.dc.html\">Lista de participantes<\u002Fa><\u002Fspan><\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Playlist de ambientación<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Gafetes con nombres de invitados<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Gafetes con nombres de staff<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Gafetes en blanco<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Plumón<\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; margin-top: 16px\">\n<div class=\"card\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px\"><h3 class=\"h3\" style=\"margin: 0\">Guión de bienvenida<\u002Fh3><span class=\"chip tag\">Guión de soporte Pao<\u002Fspan><\u002Fdiv>\n<p class=\"quote\">—¡Muy buenos días! Qué placer recibirte en el taller <b style=\"color: {{accent}}\">El Misterio del Universo y sus partituras<\u002Fb>. ¿Me podrías compartir tu nombre para entregarte el distintivo?<\u002Fp>\n<p class=\"quote\">—Aquí tienes, [nombre de participante], puedes colocártelo en el pecho del lado que gustes para que nuestro equipo de staff te identifique de inmediato.<\u002Fp>\n<ul class=\"ul\" style=\"margin: 0 0 10px\"><li>Ayudar a abrir la pegatina del tag con el nombre.<\u002Fli><\u002Ful>\n<p class=\"quote\">—Te entrego el folleto, en él podrás encontrar el programa de las actividades y más información; cualquier duda que tengas, háznosla saber. En un momento el equipo te acompaña a tu mesa.<\u002Fp>\n<h4 class=\"h4\" style=\"color: {{accent}}; margin-top: 16px\">¿Qué hacer si no encuentras el nombre?<\u002Fh4>\n<p class=\"p small\">Habrá etiquetas sin nombre: pregunta su nombre y el área de la que nos visita; por otro lado, acércate a Fer B. para definir a qué equipo se asigna. <i>Pedirle que nos espere un segundo.<\u002Fi><\u002Fp>\n<\u002Fdiv>\n<div class=\"card\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px\"><h3 class=\"h3\" style=\"margin: 0\">Guión de bienvenida<\u002Fh3><span class=\"chip tag\">Guión de soporte staff<\u002Fspan><\u002Fdiv>\n<p class=\"quote\"><b>Staff:<\u002Fb> —¡Hola! Muy buenos días, [nombre del participante]. Bienvenido/a al Workshop <font color=\"#001e5a\"><b>Experience Lab.&nbsp;<\u002Fb><\u002Ffont>Mi nombre es [nombre del staff] y hoy seré tu guía a lo largo de esta experiencia. Pasa por aquí, por favor, te acompaño a tu lugar en la mesa [nom. de mesa].<\u002Fp>\n<p class=\"small\" style=\"margin: 0 0 10px\"><i>(Mientras caminan hacia el asiento)<\u002Fi><\u002Fp>\n<p class=\"quote\"><b>Staff:<\u002Fb> —Cuéntame, ¿qué esperas de esta experiencia?…<\u002Fp>\n<p class=\"quote\" style=\"color: #001e5a\"><b>Guía:<\u002Fb> —En los folletos que están en la mesa podrás encontrar un resumen de por qué relacionamos el rediseñar la experiencia del colaborador con la temática de <b>Expericne Lab<\u002Fb>.&nbsp;Así como las actividades que tendremos durante el taller. Te recomiendo que le eches un vistazo antes de comenzar.<\u002Fp>\n<p class=\"quote\">—Por favor, siéntete con la confianza de pedirme lo que necesites; estamos aquí para que vivas la mejor experiencia. Si te apetece, puedes pasar a nuestra zona de catering antes de comenzar con las actividades.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- RECORRIDO -->\n<section id=\"recorrido\" class=\"sec\">\n<h2 class=\"h2\">Recorrido del taller<\u002Fh2>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px\">\n<span class=\"chip\" style=\"background: #E6F8E0; color: #1F6B12; border: 1.5px solid #6CCB55\">Duración total · {{totalTxt}} ({{inicioTxt}} – {{finTxt}})<\u002Fspan>\n<span class=\"chip\" style=\"background: #F3F3F3; color: #1A1A1A\">Invitación: Fer B. y Fer G. envían invitación a participantes por correo<\u002Fspan>\n<\u002Fdiv>\n<p class=\"small\" style=\"margin: 0 0 16px\">Toca cada momento para ver el detalle por rol.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 14px; border-left: 3px solid {{accent}}; padding-left: clamp(14px, 3vw, 28px); margin-left: 6px\">\n\n<details class=\"card acc\">\n<summary class=\"acc-sum\"><span style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0\"><h3 class=\"h3\" style=\"margin: 0\">Llegada de UiX<\u002Fh3><span class=\"chip time\">1 hora antes<\u002Fspan><\u002Fspan><svg class=\"chev\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n<div class=\"acc-body\">\n<div style=\"display: grid; grid-templat momento de la vida del colaborador hacen referencia?<\u002Fli><li>¿Cómo se ven reflejados los principios de autonomía que definimos al inicio?<\u002Fli><li>¿Qué información creen qué necesitarían para completar el proceso?<\u002Fli><li>¿Por qué canal lo harían?<\u002Fli><li>¿Qué aspecto innovador adaptarías de los casos de éxito?<\u002Fli><\u002Fol>\n<\u002Fdiv>\n\n<div class=\"card\">\n<p class=\"eyebrow\">Actividad 4.<\u002Fp>\n<h3 style=\"font-family: 'Sora', sans-serif; font-weight: 800; font-size: 26px; color: {{accent}}; margin: 0 0 16px; line-height: 1.15\">Conceptualicemos la receta de la fórmula<\u002Fh3>\n<h4 class=\"h4\" style=\"color: #B547C5\">Instrucciones staff<\u002Fh4>\n<ol class=\"ul\" style=\"margin-bottom: 14px\"><li><p style=\"margin: 0\">Asegúrense de apoyar a los participantes a que definan de manera más completa sus ideas.<\u002Fp><\u002Fli><\u002Fol>\n\n\n\n\n\n\n<h4 class=\"h4\" style=\"color: #B547C5; margin-top: 14px\">Preguntas guía<\u002Fh4>\n<ol class=\"ul\"><li>Desarrollen lo más posible idea.<\u002Fli><li>¿Retomarían alguna idea que los demás participantes de las otras mesas dijeron?, ¿Cómo?<\u002Fli><li>En el storyboard desarrollen la idea como se la imaginarían en sus dia a día dentro de su espacio laboral. ¿En que contexto vivirían esa experiencia?<\u002Fli><\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"observaciones\" class=\"card\" style=\"margin-top: 16px; scroll-margin-top: 72px\">\n<p class=\"eyebrow\">Transversal<\u002Fp>\n<h3 style=\"font-family: 'Sora', sans-serif; font-weight: 800; font-size: 26px; color: {{accent}}; margin: 0 0 14px; line-height: 1.15\">Guía de observaciones<\u002Fh3>\n<p class=\"p\">Esta guía sirve como referencia para que el staff tome notas durante las actividades.<\u002Fp>\n<p class=\"p\">El objetivo de la actividad es conocer cómo esperan vivir la experiencia en los diferentes momentos de la vida del colaborador.&nbsp;<\u002Fp>\n<h4 class=\"h3\" style=\"margin-top: 20px\">¿Qué información podrían recabar?<\u002Fh4>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px\">\n<div class=\"role\" style=\"background: #FFF5F7\"><b style=\"color: #B547C5\">Comportamiento y lenguaje corporal<\u002Fb>Cómo reaccionan cuando reciben una orden (se ríen, se frustran, se quedan callados, empiezan a inventar sobre la marcha); qué pasa cuando tienen que regresar algo o corregirlo (lo toman con calma, se estresan, se culpan entre ellos, lo resuelven rápido); si alguien se ve desconectado o fuera de la conversación.<\u002Fdiv>\n<div class=\"role\" style=\"background: #FFF5F7\"><b style=\"color: rgb(181, 71, 197)\">Lo que dicen — frases textuales<\u002Fb>1. Si han experimentado un proceso dónde hayan sido autónomos, no necesariamente del trabajo, ¿Cómo la vivieron?<\u002Fdiv>\n\n<div class=\"role\" style=\"background: #FFF5F7\"><b style=\"color: rgb(181, 71, 197)\">Qué les frustra (dolores)<\u002Fb>1. Dolores que viven durante sus experiencia.<br>2. ¿Cómo solucionan ese problema o dolor?<br>3. ¿Qué implica ir por esa solución (más tiempo, etc....)?<\u002Fdiv>\n<div class=\"role\" style=\"background: #FFF5F7\"><span style=\"color: rgb(181, 71, 197)\"><b>Qué consideran bueno dentro de la experiencia actual<\u002Fb><span style=\"font-size: 14px; color: rgb(26, 26, 26); font-family: &quot;DM Sans&quot;, system-ui, sans-serif\">1. Puntos buenos durante la experiencia.<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<h4 class=\"h4\" style=\"margin-top: 20px\">Mis notas<\u002Fh4>\n<label class=\"small\" for=\"notas\" style=\"display: block; margin-bottom: 6px\">Escribe aquí tus observaciones durante la actividad.<\u002Flabel>\n<textarea id=\"notas\" rows=\"5\" placeholder=\"Mesa, frase textual, momento…\" style=\"width: 100%; box-sizing: border-box; border: 1.5px solid #DDDDDD; border-radius: 12px; padding: 12px; font: inherit; font-size: 15px; resize: vertical\"><\u002Ftextarea>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- MESAS -->\n<section id=\"mesas\" class=\"sec\">\n<h2 class=\"h2\">Listado de participantes<\u002Fh2>\n<p class=\"small\" style=\"margin: -12px 0 18px\">42 invitados confirmados y 14 personas del equipo UiX. Para marcar llegadas, asignar mesa y staff, abre la <a href=\"Participantes.dc.html\">Lista de participantes<\u002Fa>.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px\">\n\n<div class=\"mesa\" style=\"background: #E3EDFF\">\n<h3 class=\"h4\" style=\"margin: 0\">Colaboradores (15)<\u002Fh3>\n<ul class=\"ul\" style=\"font-size: 14px\"><li>Alejandro Ruiz Pacheco <span style=\"color: #5A5A5A; font-size: 12px\">· Gerente comercial movilidad países<\u002Fspan><\u002Fli><li>Brandon Padilla Carmona <span style=\"color: #5A5A5A; font-size: 12px\">· Especialista de retención y lealtad<\u002Fspan><\u002Fli><li>Carlos David Salas Guerrero <span style=\"color: #5A5A5A; font-size: 12px\">· Gerente proyectos<\u002Fspan><\u002Fli><li>Carol Aguilar González <span style=\"color: #5A5A5A; font-size: 12px\">· Gerente desarrollo<\u002Fspan><\u002Fli><li>Claudia Mariana Parente Ramos <span style=\"color: #5A5A5A; font-size: 12px\">· Desarrollador iOS<\u002Fspan><\u002Fli><li>César Ignacio Hernández Díaz <span style=\"color: #5A5A5A; font-size: 12px\">· GEE · Auditoría<\u002Fspan><\u002Fli><li>Diego Alexis Ramos Renderos <span style=\"color: #5A5A5A; font-size: 12px\">· Consultor implementación canales físicos<\u002Fspan><\u002Fli><li>Gretchen Elvira Guzmán Estrada <span style=\"color: #5A5A5A; font-size: 12px\">· Coordinador<\u002Fspan><\u002Fli><li>Kenia Guadalupe Gutiérrez López <span style=\"color: #5A5A5A; font-size: 12px\">· Asesor afiliación<\u002Fspan><\u002Fli><li>Leslie Daranny Salinas Hernández <span style=\"color: #5A5A5A; font-size: 12px\">· Auditor Sr.<\u002Fspan><\u002Fli><li>Lizbeth Hernández Valdez <span style=\"color: #5A5A5A; font-size: 12px\">· Líder prendario en entrenamiento<\u002Fspan><\u002Fli><li>L ><\u002Fdiv>\n<div style=\"grid-column: 4 / span 2; align-self: start\"><div class=\"pill\">Pantalla 4<\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column: 6; align-self: start\"><div class=\"mbox\" style=\"border: 1.5px dashed {{accent}}; font-size: 13px; font-weight: 600\">Mesa<br>staff<\u002Fdiv><\u002Fdiv>\n\n<div style=\"grid-column: 1\"><div class=\"mbox\" style=\"background: #D9D9D9\">Mesa 9<br>8 sillas<\u002Fdiv><div class=\"small\" style=\"text-align: center; margin-top: 4px\">Solo equipo de staff<\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column: 2\"><div class=\"mbox\" style=\"background: #FFE0F2\">Mesa 4<br>8 sillas<\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column: 4\"><div class=\"mbox\" style=\"background: #E3D7FF\">Mesa 5<br>8 sillas<\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column: 5\"><div class=\"mbox\" style=\"background: #FFF1A8\">Mesa 6<br>8 sillas<\u002Fdiv><\u002Fdiv>\n\n<div style=\"grid-column: 1\"><div class=\"mbox\" style=\"background: #BDEBFA\">Mesa 2<br>8 sillas<\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column: 2\"><div class=\"mbox\" style=\"background: #D2F5B5\">Mesa 3<br>8 sillas<\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column: 4\"><div class=\"mbox\" style=\"background: #FFD09A\">Mesa 1<br>8 sillas<\u002Fdiv><\u002Fdiv>\n\n<div style=\"grid-column: 1 / span 2\"><div class=\"pill\">Pantalla 2<\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column: 4 / span 2\"><div class=\"pill\">Pantalla 3<\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column: 2 / span 2; margin-bottom: -4px\"><div class=\"mbox\" style=\"background: #D6E4FF; border-radius: 999px; font-size: 18px\">Entrada<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 10px\"><span aria-hidden=\"true\" style=\"font-size: 18px; line-height: 1; color: #5A5A5A\">↑<\u002Fspan><div class=\"chk-out\" style=\"border: 1.5px dashed {{accent}}; border-radius: 10px; padding: 8px 16px; text-align: center; font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 600\">Mesa de Check-In<br><span style=\"font-weight: 400; font-size: 12px\">Fuera de la sala, junto a la entrada<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- BACKSTAGE -->\n<section id=\"backstage\" class=\"sec\">\n<p class=\"eyebrow\">Recomendación de<\u002Fp>\n<h2 class=\"h2\">Contenido backstage<\u002Fh2>\n<div style=\"display: flex; gap: 8px; align-items: center; margin-bottom: 18px\"><img class=\"ava-s\" src=\"90fa9727-4507-4fe5-90d6-88e4c3138f99\" alt=\"\"><img class=\"ava-s\" src=\"c8c40f7b-13dc-4354-a272-5b9be508255e\" alt=\"\" style=\"margin-left: -16px\"><span class=\"small\">Abi y Charlie<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px\">\n<div class=\"card\">\n<h3 class=\"h3\" style=\"color: #B547C5\">Antes<\u002Fh3>\n<label class=\"check\"><input type=\"checkbox\">Mientras acomodamos los materiales, mesas, pegamos flyers, etc.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Cómo se ven las mesas con los materiales (closeup).<\u002Flabel>\n<\u002Fdiv>\n<div class=\"card\">\n<h3 class=\"h3\" style=\"color: #B547C5\">Durante<\u002Fh3>\n<label class=\"check\"><input type=\"checkbox\">Llegada de los invitados (cuando entran a la sala, se colocan sus nombres y cuando el staff los lleva a su lugar).<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Mike mientras habla con los participantes.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Entrevista a los participantes de la expectativa que tienen del taller.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Fotos de arranque del taller.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Clips o fotos a moderadores mientras presentan.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Clips o fotos durante las actividades.<\u002Flabel>\n<\u002Fdiv>\n<div class=\"card\">\n<h3 class=\"h3\" style=\"color: #B547C5\">Después<\u002Fh3>\n<label class=\"check\"><input type=\"checkbox\">Entrevista a los participantes de cómo les pareció el taller.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Mientras contestan el QR para calificar el taller.<\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"margin-top: 56px; padding-top: 24px; border-top: 1px solid #EEEEEE; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span class=\"small\">Workshop El Combo del Diseño · Universidad de la Libertad, Piso 3 · Sala 13<\u002Fspan>\n<img src=\"f9bc03fe-3793-4004-aca8-286b00b4cd4e\" alt=\"UiX\" style=\"height: 32px; width: auto\">\n<\u002Ffooter>\n\n<\u002Fmain>\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div style=\"--accent: #001E5A; min-height: 100vh; background: #FFFFFF\" data-canvas-width=\"1280\" data-canvas-height=\"8000\" data-document-role=\"page\" data-label=\"Guía de staff (desktop y móvil)\">\n\n<nav class=\"nav\" aria-label=\"Secciones\" style=\"position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,0.96); border-bottom: 1px solid #EEEEEE; backdrop-filter: blur(8px)\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 6px 12px; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none\">\n<img src=\"f9bc03fe-3793-4004-aca8-286b00b4cd4e\" alt=\"UiX\" style=\"height: 26px; width: auto; margin: 0 10px 0 4px; flex-shrink: 0\">\n<a href=\"#inicio\">Inicio<\u002Fa>\n<a href=\"#equipo\">Equipo<\u002Fa>\n<a href=\"#llegada\">Llegada<\u002Fa>\n<a href=\"#recepcion\">Recepción<\u002Fa>\n<a href=\"detalle.dc.html\">Participantes ↗<\u002Fa>\n<a href=\"#recorrido\">Recorrido<\u002Fa>\n<a href=\"#actividades\">Actividades<\u002Fa>\n<a href=\"#mesas\">Mesas<\u002Fa>\n<a href=\"#mapa\">Mapa<\u002Fa>\n<a href=\"#backstage\">Backstage<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n\n<main style=\"margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px) 80px; box-sizing: border-box\">\n\n\n<section id=\"inicio\" class=\"sec\" style=\"padding-top: 40px\">\n<p class=\"eyebrow\">Guía para staff · Workshop UiX<\u002Fp>\n<h1 style=\"font-family: 'Anton', sans-serif; font-weight: 400; font-size: clamp(44px, 8vw, 104px); line-height: 0.95; color: #001E5A; margin: 16px 0 28px; text-transform: uppercase; letter-spacing: -0.01em; max-width: 1000px\">EXPERIENCE LAB.<\u002Fh1>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 24px\">\n<div>\n<h2 class=\"h3\">Objetivos del taller<\u002Fh2>\n<div class=\"outline\">Construir una visión compartida del ecosistema de plataformas de Capital Humano que permita a formadores y colaboradores operar con autonomía, de manera seamless.<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<p class=\"p\"><span><\u002Fspan><span><\u002Fspan><span style=\"white-space: pre-wrap\">Operar con autonomía y de forma fluida no surge por casualidad; requiere construir juntos una visión compartida.<\u002Fspan><br><span style=\"white-space: pre-wrap\"> Esa visión es la que traemos al Workshop <span style=\"font-weight: bold\">Experience Lab:<\u002Fspan> un espacio para idear y experimentar como en un laboratorio, donde buscamos la mejor fórmula para diseñar la experiencia de vida del colaborador. <\u002Fspan><br><span style=\"white-space: pre-wrap\">Vamos a explorar bajo qué principios de autonomía se regirá la experiencia, a conocer cuál podría ser la mejor forma de vivirla y a descubrir cómo todo esto se verá reflejado de manera fluida y autónoma en el ecosistema digital con el que interactúan.<\u002Fspan><\u002Fp>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h2 class=\"h3\" style=\"margin-top: 40px\">Contexto<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px\">\n<div>\n<h3 class=\"h4\">Cliente<\u002Fh3>\n<div class=\"outline\">Capital Humano<\u002Fdiv>\n<h3 class=\"h4\" style=\"margin-top: 16px\">Fecha · Hora · Lugar/Sala<\u002Fh3>\n<div class=\"outline\">Viernes 23 de octubre de 9:00 am a 2:00 pm<br>Universidad de la Libertad Sala 13, Piso 3<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h3 class=\"h4\">Nu. de personas<\u002Fh3>\n<div class=\"outline\">40 personas<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h3 class=\"h4\">Temática del taller<\u002Fh3>\n<div class=\"outline\">Experience Lab. Los participantes son parte de una experiencia como especialista que tratan de descubrir cual es la fórmula para diseñar la nueva experiencia del colaborador.&nbsp;<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"equipo\" class=\"sec\">\n<h2 class=\"h2\">Nuestro equipo<\u002Fh2>\n<p style=\"font-family: 'Sora', sans-serif; font-weight: 600; font-size: clamp(18px, 2.4vw, 24px); line-height: 1.4; margin: 0 0 32px; max-width: 860px\">Como equipo somos los encargados de llevar el taller, <span style=\"color: #001E5A\">estar en escucha activa, observar lo que hacen los participantes, tomar notas de los insights<\u002Fspan> y al mismo tiempo, <span style=\"color: #001E5A\">fomentar la participación<\u002Fspan>.<\u002Fp>\n\n<h3 class=\"h3\">Staff<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 20px 12px; margin-bottom: 32px\">\n<div style=\"display: flex; flex-direction: column; align-items: center\"><div aria-hidden=\"true\" style=\"width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(180deg, #9BE33F 0%, #1FC98A 100%)\"><\u002Fdiv><div class=\"who\">Ma.Fer<br>Domínguez<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\"><img class=\"ava\" src=\"bc3efcd6-9232-436b-8993-24c9de1040a5\" alt=\"Caro Arámbula\"><div class=\"who\">Caro<br>Arámbula<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\"><img class=\"ava\" src=\"fc74891e-7592-46d3-becc-d1f68f97f382\" alt=\"Tere Aguilar\"><div class=\"who\">Tere<br>Aguilar<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\"><img class=\"ava\" src=\"d061ac2b-f850-4183-91b3-7e2e5ed37fbe\" alt=\"Adri Martínez\"><div class=\"who\">Adri<br>Martínez<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\"><img class=\"ava\" src=\"0784d523-5cfc-4d4f-b5e5-3fd41749e91e\" alt=\"Yun Sánchez\"><div class=\"who\">Yun<br>Sánchez<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\"><img class=\"ava\" src=\"1c4de95e-005f-4c0b-ac1f-8470b3c181ef\" alt=\"Yisus\"><div class=\"who\">Yisus<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center\"><img class=\"ava\" src=\"e21408c9-0811-4576-b352-374c3c0e352f\" alt=\"Pao Toledo\"><div class=\"who\">Pao<br>Toledo<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 28px\">\n<div>\n<h3 class=\"h3\">CEO<\u002Fh3>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"b44eb8ec-5ac5-4c61-942c-4b5691f9527d\" alt=\"Mike Flores\"><div class=\"who\">Mike<br>Flores<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h3 class=\"h3\">Marketing<\u002Fh3>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"90fa9727-4507-4fe5-90d6-88e4c3138f99\" alt=\"Abi Acosta\"><div class=\"who\">Abi<br>Acosta<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"c8c40f7b-13dc-4354-a272-5b9be508255e\" alt=\"Charlie Villegas\"><div class=\"who\">Charlie<br>Villegas<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"1ea9b519-0a88-4b93-a5b2-1bdfedc3cdbf\" alt=\"Dani Lorelle\"><div class=\"who\">Dani<br>Lorelle<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h3 class=\"h3\">Diseño y facilitación<\u002Fh3>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"f69290bb-1622-4e73-8587-b911a94e33af\" alt=\"Caro Quintal\"><div class=\"who\">Caro<br>Quintal<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<h3 class=\"h3\">Backstage<\u002Fh3>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"20cb2dc7-1f80-43ce-8d17-54dcfcc4f403\" alt=\"Fer Barcienas\"><div class=\"who\">Fer<br>Barcienas<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; width: 96px\"><img class=\"ava\" src=\"c8b6abd6-4748-42e7-ac94-99e745879eac\" alt=\"Fer Gallardo\"><div class=\"who\">Fer<br>Gallardo<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"llegada\" class=\"sec\">\n<h2 class=\"h2\">Previo al taller y logística de llegada<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; margin-bottom: 16px\">\n<div class=\"card\">\n<h3 class=\"h3\">Dress code<\u002Fh3>\n<ul class=\"ul\"><li>Blusa/camisa color blanca y jeans · medianamente formal<\u002Fli><\u002Ful>\n<h3 class=\"h3\" style=\"margin-top: 20px\">Acceso y hora de llegada<\u002Fh3>\n<ul class=\"ul\">\n<li>Mostrar QR Zeus (por entrada peatonal).<\u002Fli>\n<li>Mostrar el folio de entrada (los que solicitaron lugar de estacionamiento).<\u002Fli>\n<li>Les pedimos puntualidad para la llegada.<\u002Fli>\n<\u002Ful>\n<div style=\"display: flex; flex-direction: column; gap: 8px; margin-top: 14px\">\n<div style=\"display: flex; gap: 12px; align-items: baseline\"><span class=\"chip time\" style=\"flex-shrink: 0\">8:40 am<\u002Fspan><span class=\"small\" style=\"color: #1A1A1A\">Llegada de <b>Fer B., Caro Quintal, Pao, Abi y Charlie<\u002Fb>.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 12px; align-items: baseline\"><span class=\"chip time\" style=\"flex-shrink: 0\">9:00 am<\u002Fspan><span class=\"small\" style=\"color: rgb(26, 26, 26)\">Universidad de la Libertad, <b>Piso 3 · Sala 1<\u002Fb>, todos los demás.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\">\n<h3 class=\"h3\">Material adicional<\u002Fh3>\n<div style=\"display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center\">\n<div aria-hidden=\"true\" style=\"width: 44px; height: 44px; border-radius: 50%; border: 2px solid #FFFFFF; box-sizing: border-box; background: linear-gradient(180deg, #9BE33F 0%, #1FC98A 100%)\"><\u002Fdiv>\n<img class=\"ava-s\" src=\"bc3efcd6-9232-436b-8993-24c9de1040a5\" alt=\"Caro Arámbula\">\n\n<img class=\"ava\" src=\"0784d523-5cfc-4d4f-b5e5-3fd41749e91e\" alt=\"Yun Sánchez\" style=\"width: 47px; height: 47px\"><img class=\"ava-s\" src=\"d061ac2b-f850-4183-91b3-7e2e5ed37fbe\" alt=\"Adri Martínez\">\n<span class=\"small\">Ma.Fer, Caro Arámbula, Yun y Adri Martínez<\u002Fspan>\n<\u002Fdiv>\n<ul class=\"ul\">\n<li>Asegurar tener acceso de edición a los Figmas o archivos<br>Casos de éxito presentación en Claude y Flujos de momentos de vida del Colaborador.<\u002Fli>\n<li>Llevar computadora cargada, desbloqueada y sin contraseña.<\u002Fli><li>Si tienen iPad u otro dispositivo llevarlo cargado y sin contraseña de bloqueo.<\u002Fli>\n<\u002Ful>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h3 class=\"h3\" style=\"margin-top: 28px\">¿Qué tengo que hacer cuando llegue?<\u002Fh3>\n<p class=\"small\" style=\"margin: 0 0 14px\">Marca cada tarea al terminarla.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px\">\n<div class=\"card\">\n<div style=\"display: flex; gap: 10px; align-items: center; margin-bottom: 8px\"><img class=\"ava-s\" src=\"20cb2dc7-1f80-43ce-8d17-54dcfcc4f403\" alt=\"\"><h4 class=\"h4\" style=\"margin: 0\">Fer Barcienas<\u002Fh4><\u002Fdiv>\n<label class=\"check\"><input type=\"checkbox\">Acomodo de mesas y poner material, distintivos de mesa, gafetes y manteles.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Conexión de pantallas y proyección de presentación (correrla toda con clicker).<\u002Flabel>\n<\u002Fdiv>\n\n<div class=\"card\">\n<div style=\"display: flex; gap: 10px; align-items: center; margin-bottom: 8px\"><img class=\"ava-s\" src=\"e21408c9-0811-4576-b352-374c3c0e352f\" alt=\"\"><h4 class=\"h4\" style=\"margin: 0\">Pao Toledo<\u002Fh4><\u002Fdiv>\n<label class=\"check\"><input type=\"checkbox\">Acomodar la mesa de recepción.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Tener los folletos listos de un lado.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\"><span>Tener las etiquetas de los participantes en orden alfabético.<\u002Fspan><\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\"><span>Tener plumón para poner nombre a las etiquetas en caso de que no esté el nombre en la lista.<\u002Fspan><\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\"><span>Estar pendiente de los participantes y decirles que la entrada es hasta las 9:50 am.<\u002Fspan><\u002Flabel><label class=\"check\"><input type=\"checkbox\"><span>La lista de participantes la puedes encontrar en la pestaña de \"Participantes\"<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n<div class=\"card\">\n<div style=\"display: flex; gap: 10px; align-items: center; margin-bottom: 8px\"><img class=\"ava-s\" src=\"c8c40f7b-13dc-4354-a272-5b9be508255e\" alt=\"\"><h4 class=\"h4\" style=\"margin: 0\">Charlie<\u002Fh4><\u002Fdiv>\n<label class=\"check\"><input type=\"checkbox\"><span>Hacer tomas del backstage, ej. ver guía <a href=\"#backstage\">“Contenido recomendado backstage”<\u002Fa>.<\u002Fspan><\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Entrevistar a los participantes sobre las expectativas del taller.<\u002Flabel>\n<\u002Fdiv>\n<div class=\"card\">\n<div style=\"display: flex; gap: 10px; align-items: center; margin-bottom: 8px\"><img class=\"ava-s\" src=\"fc74891e-7592-46d3-becc-d1f68f97f382\" alt=\"Tere\"><img class=\"ava\" src=\"0784d523-5cfc-4d4f-b5e5-3fd41749e91e\" alt=\"Yun Sánchez\" style=\"width: 47px; height: 47px\"><h4 class=\"h4\" style=\"margin: 0\">Tere y Yun<\u002Fh4><\u002Fdiv>\n<label class=\"check\"><input type=\"checkbox\"><span>Revisar que todos los materiales&nbsp;estén acomodados en la mesa de staff.<\u002Fspan><\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\"><span>Pegar el cartel principal en la puerta principal.<\u002Fspan><\u002Flabel>\n\n<\u002Fdiv><div class=\"card\">\n<div style=\"display: flex; gap: 10px; align-items: center; margin-bottom: 8px\"><img class=\"ava-s\" src=\"bc3efcd6-9232-436b-8993-24c9de1040a5\" alt=\"Caro A.\" style=\"margin-left: -16px\"><img class=\"ava\" src=\"0784d523-5cfc-4d4f-b5e5-3fd41749e91e\" alt=\"Yun Sánchez\" style=\"width: 47px; height: 47px\"><img class=\"ava-s\" src=\"d061ac2b-f850-4183-91b3-7e2e5ed37fbe\" alt=\"Adri\" style=\"margin-left: -16px\"><h4 class=\"h4\" style=\"margin: 0\">Ma.Fer, Caro A. y Adri<\u002Fh4><\u002Fdiv>\n\n\n<label class=\"check\"><input type=\"checkbox\"><span>Colocar post-its y marcadores en las mesas.<\u002Fspan><\u002Flabel><label class=\"check\"><input type=\"checkbox\"><span>Colocar los distintivos de los participantes en sus mesas.<\u002Fspan><\u002Flabel>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"recepcion\" class=\"sec\">\n<h2 class=\"h2\">Recepción de participantes<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px\">\n<div class=\"card\">\n<h3 class=\"h3\">¿A qué hora pueden pasar?<\u002Fh3>\n<p class=\"p\">Los participantes podrán entrar a la sala hasta las <b>9:50 am<\u002Fb> (Check-In con Pao).<\u002Fp>\n<p class=\"p\" style=\"color: #001E5A; font-weight: 700\">El WS empieza a las 10:05 aprox.<\u002Fp>\n<h3 class=\"h3\" style=\"margin-top: 20px\">¿Cómo es la experiencia?<\u002Fh3>\n<p class=\"p\">Los participantes llegan, suben a la sala y los recibe un banner de bienvenida del Workshop.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 12px\">\n<div class=\"role\" style=\"background: #FDF0F4\"><b style=\"color: #B547C5\">Antes de que entren a la sala<\u002Fb><strong>Pao:<\u002Fstrong> dar los gafetes de nombres mientras los participantes están en la sala de espera.<br><strong>Fer:<\u002Fstrong> pone música de ambientación.<\u002Fdiv>\n<div class=\"role\" style=\"background: #FDF0F4\"><b style=\"color: #B547C5\">Cuando entran los participantes<\u002Fb><strong>Pao:<\u002Fstrong> les da la bienvenida y les da el folleto del cronograma.<br><strong>Staff:<\u002Fstrong> identifica cuál es la mesa en la que está asignado(a) el participante y lo acompaña (según la <a href=\"#mesas\">lista de asientos<\u002Fa>).<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\">\n<h3 class=\"h3\">Materiales de recepción<\u002Fh3>\n<p class=\"small\" style=\"margin: 0 0 6px\">Asegúrate de contar con todo:<\u002Fp>\n<label class=\"check\"><input type=\"checkbox\">Folletos de bienvenida<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\"><span><a href=\"Participantes.dc.html\">Lista de participantes<\u002Fa><\u002Fspan><\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Playlist de ambientación<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Gafetes con nombres de invitados<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Gafetes con nombres de staff<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Gafetes en blanco<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Plumón<\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; margin-top: 16px\">\n<div class=\"card\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px\"><h3 class=\"h3\" style=\"margin: 0\">Guión de bienvenida<\u002Fh3><span class=\"chip tag\">Guión de soporte Pao<\u002Fspan><\u002Fdiv>\n<p class=\"quote\">—¡Muy buenos días! Qué placer recibirte en el taller <b style=\"color: #001E5A\">El Misterio del Universo y sus partituras<\u002Fb>. ¿Me podrías compartir tu nombre para entregarte el distintivo?<\u002Fp>\n<p class=\"quote\">—Aquí tienes, [nombre de participante], puedes colocártelo en el pecho del lado que gustes para que nuestro equipo de staff te identifique de inmediato.<\u002Fp>\n<ul class=\"ul\" style=\"margin: 0 0 10px\"><li>Ayudar a abrir la pegatina del tag con el nombre.<\u002Fli><\u002Ful>\n<p class=\"quote\">—Te entrego el folleto, en él podrás encontrar el programa de las actividades y más información; cualquier duda que tengas, háznosla saber. En un momento el equipo te acompaña a tu mesa.<\u002Fp>\n<h4 class=\"h4\" style=\"color: #001E5A; margin-top: 16px\">¿Qué hacer si no encuentras el nombre?<\u002Fh4>\n<p class=\"p small\">Habrá etiquetas sin nombre: pregunta su nombre y el área de la que nos visita; por otro lado, acércate a Fer B. para definir a qué equipo se asigna. <i>Pedirle que nos espere un segundo.<\u002Fi><\u002Fp>\n<\u002Fdiv>\n<div class=\"card\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px\"><h3 class=\"h3\" style=\"margin: 0\">Guión de bienvenida<\u002Fh3><span class=\"chip tag\">Guión de soporte staff<\u002Fspan><\u002Fdiv>\n<p class=\"quote\"><b>Staff:<\u002Fb> —¡Hola! Muy buenos días, [nombre del participante]. Bienvenido/a al Workshop <font color=\"#001e5a\"><b>Experience Lab.&nbsp;<\u002Fb><\u002Ffont>Mi nombre es [nombre del staff] y hoy seré tu guía a lo largo de esta experiencia. Pasa por aquí, por favor, te acompaño a tu lugar en la mesa [nom. de mesa].<\u002Fp>\n<p class=\"small\" style=\"margin: 0 0 10px\"><i>(Mientras caminan hacia el asiento)<\u002Fi><\u002Fp>\n<p class=\"quote\"><b>Staff:<\u002Fb> —Cuéntame, ¿qué esperas de esta experiencia?…<\u002Fp>\n<p class=\"quote\" style=\"color: #001e5a\"><b>Guía:<\u002Fb> —En los folletos que están en la mesa podrás encontrar un resumen de por qué relacionamos el rediseñar la experiencia del colaborador con la temática de <b>Expericne Lab<\u002Fb>.&nbsp;Así como las actividades que tendremos durante el taller. Te recomiendo que le eches un vistazo antes de comenzar.<\u002Fp>\n<p class=\"quote\">—Por favor, siéntete con la confianza de pedirme lo que necesites; estamos aquí para que vivas la mejor experiencia. Si te apetece, puedes pasar a nuestra zona de catering antes de comenzar con las actividades.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"recorrido\" class=\"sec\">\n<h2 class=\"h2\">Recorrido del taller<\u002Fh2>\n<div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px\">\n<span class=\"chip\" style=\"background: #E6F8E0; color: #1F6B12; border: 1.5px solid #6CCB55\">Duración total · {{totalTxt}} ({{inicioTxt}} – {{finTxt}})<\u002Fspan>\n<span class=\"chip\" style=\"background: #F3F3F3; color: #1A1A1A\">Invitación: Fer B. y Fer G. envían invitación a participantes por correo<\u002Fspan>\n<\u002Fdiv>\n<p class=\"small\" style=\"margin: 0 0 16px\">Toca cada momento para ver el detalle por rol.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 14px; border-left: 3px solid #001E5A; padding-left: clamp(14px, 3vw, 28px); margin-left: 6px\">\n\n<details class=\"card acc\">\n<summary class=\"acc-sum\"><span style= ciones staff<\u002Fh4>\n<ol class=\"ul\" style=\"margin-bottom: 14px\"><li>Asegúrense de apoyar a los participantes a que definan de manera más completa sus ideas.&nbsp;<\u002Fli><\u002Fol>\n\n\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 8px 0 16px\">\n\n\n\n\n<\u002Fdiv>\n<h4 class=\"h4\" style=\"color: #B547C5\">Preguntas guía<\u002Fh4>\n<ol class=\"ul\"><li>¿A qué momento de la vida del colaborador hacen referencia?<\u002Fli><li>¿Cómo se ven reflejados los principios de autonomía que definimos al inicio?<\u002Fli><li>¿Qué información creen qué necesitarían para completar el proceso?<\u002Fli><li>¿Por qué canal lo harían?<\u002Fli><li>¿Qué aspecto innovador adaptarías de los casos de éxito?<\u002Fli><\u002Fol>\n<\u002Fdiv>\n\n<div class=\"card\">\n<p class=\"eyebrow\">Actividad 4.<\u002Fp>\n<h3 style=\"font-family: 'Sora', sans-serif; font-weight: 800; font-size: 26px; color: #001E5A; margin: 0 0 16px; line-height: 1.15\">Conceptualicemos la receta de la fórmula<\u002Fh3>\n<h4 class=\"h4\" style=\"color: #B547C5\">Instrucciones staff<\u002Fh4>\n<ol class=\"ul\" style=\"margin-bottom: 14px\"><li><p style=\"margin: 0\">Asegúrense de apoyar a los participantes a que definan de manera más completa sus ideas.<\u002Fp><\u002Fli><\u002Fol>\n\n\n\n\n\n\n<h4 class=\"h4\" style=\"color: #B547C5; margin-top: 14px\">Preguntas guía<\u002Fh4>\n<ol class=\"ul\"><li>Desarrollen lo más posible idea.<\u002Fli><li>¿Retomarían alguna idea que los demás participantes de las otras mesas dijeron?, ¿Cómo?<\u002Fli><li>En el storyboard desarrollen la idea como se la imaginarían en sus dia a día dentro de su espacio laboral. ¿En que contexto vivirían esa experiencia?<\u002Fli><\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"observaciones\" class=\"card\" style=\"margin-top: 16px; scroll-margin-top: 72px\">\n<p class=\"eyebrow\">Transversal<\u002Fp>\n<h3 style=\"font-family: 'Sora', sans-serif; font-weight: 800; font-size: 26px; color: #001E5A; margin: 0 0 14px; line-height: 1.15\">Guía de observaciones<\u002Fh3>\n<p class=\"p\">Esta guía sirve como referencia para que el staff tome notas durante las actividades.<\u002Fp>\n<p class=\"p\">El objetivo de la actividad es conocer cómo esperan vivir la experiencia en los diferentes momentos de la vida del colaborador.&nbsp;<\u002Fp>\n<h4 class=\"h3\" style=\"margin-top: 20px\">¿Qué información podrían recabar?<\u002Fh4>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px\">\n<div class=\"role\" style=\"background: #FFF5F7\"><b style=\"color: #B547C5\">Comportamiento y lenguaje corporal<\u002Fb>Cómo reaccionan cuando reciben una orden (se ríen, se frustran, se quedan callados, empiezan a inventar sobre la marcha); qué pasa cuando tienen que regresar algo o corregirlo (lo toman con calma, se estresan, se culpan entre ellos, lo resuelven rápido); si alguien se ve desconectado o fuera de la conversación.<\u002Fdiv>\n<div class=\"role\" style=\"background: #FFF5F7\"><b style=\"color: rgb(181, 71, 197)\">Lo que dicen — frases textuales<\u002Fb>1. Si han experimentado un proceso dónde hayan sido autónomos, no necesariamente del trabajo, ¿Cómo la vivieron?<\u002Fdiv>\n\n<div class=\"role\" style=\"background: #FFF5F7\"><b style=\"color: rgb(181, 71, 197)\">Qué les frustra (dolores)<\u002Fb>1. Dolores que viven durante sus experiencia.<br>2. ¿Cómo solucionan ese problema o dolor?<br>3. ¿Qué implica ir por esa solución (más tiempo, etc....)?<\u002Fdiv>\n<div class=\"role\" style=\"background: #FFF5F7\"><span style=\"color: rgb(181, 71, 197)\"><b>Qué consideran bueno dentro de la experiencia actual<\u002Fb><span style=\"font-size: 14px; color: rgb(26, 26, 26); font-family: &quot;DM Sans&quot;, system-ui, sans-serif\">1. Puntos buenos durante la experiencia.<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<h4 class=\"h4\" style=\"margin-top: 20px\">Mis notas<\u002Fh4>\n<label class=\"small\" for=\"notas\" style=\"display: block; margin-bottom: 6px\">Escribe aquí tus observaciones durante la actividad.<\u002Flabel>\n<textarea id=\"notas\" rows=\"5\" placeholder=\"Mesa, frase textual, momento…\" style=\"width: 100%; box-sizing: border-box; border: 1.5px solid #DDDDDD; border-radius: 12px; padding: 12px; font: inherit; font-size: 15px; resize: vertical\"><\u002Ftextarea>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"mesas\" class=\"sec\">\n<h2 class=\"h2\">Listado de participantes<\u002Fh2>\n<p class=\"small\" style=\"margin: -12px 0 18px\">42 invitados confirmados y 14 personas del equipo UiX. Para marcar llegadas, asignar mesa y staff, abre la <a href=\"Participantes.dc.html\">Lista de participantes<\u002Fa>.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px\">\n\n<div class=\"mesa\" style=\"background: #E3EDFF\">\n<h3 class=\"h4\" style=\"margin: 0\">Colaboradores (15)<\u002Fh3>\n<ul class=\"ul\" style=\"font-size: 14px\"><li>Alejandro Ruiz Pacheco <span style=\"color: #5A5A5A; font-size: 12px\">· Gerente comercial movilidad países<\u002Fspan><\u002Fli><li>Brandon Padilla Carmona <span style=\"color: #5A5A5A; font-size: 12px\">· Especialista de retención y lealtad<\u002Fspan><\u002Fli><li>Carlos David Salas Guerrero <span style=\"color: #5A5A5A; font-size: 12px\">· Gerente proyectos<\u002Fspan><\u002Fli><li>Carol Aguilar González <span style=\"color: #5A5A5A; font-size: 12px\">· Gerente desarrollo<\u002Fspan><\u002Fli><li>Claudia Mariana Parente Ramos <span style=\"color: #5A5A5A; font-size: 12px\">· Desarrollador iOS<\u002Fspan><\u002Fli><li>César Ignacio Hernández Díaz <span style=\"color: #5A5A5A; font-size: 12px\">· GEE · Auditoría<\u002Fspan><\u002Fli><li>Diego Alexis Ramos Renderos <span style=\"color: #5A5A5A; font-size: 12px\">· Consultor implementación canales físicos<\u002Fspan><\u002Fli><li>Gretchen Elvira Guzmán Estrada <span style=\"color: #5A5A5A; font-size: 12px\">· Coordinador<\
