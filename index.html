div><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 10px\"><span aria-hidden=\"true\" style=\"font-size: 18px; line-height: 1; color: #5A5A5A\">↑<\u002Fspan><div class=\"chk-out\" style=\"border: 1.5px dashed #001E5A; border-radius: 10px; padding: 8px 16px; text-align: center; font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 600\">Mesa de Check-In<br><span style=\"font-weight: 400; font-size: 12px\">Fuera de la sala, junto a la entrada<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"backstage\" class=\"sec\">\n<p class=\"eyebrow\">Recomendación de<\u002Fp>\n<h2 class=\"h2\">Contenido backstage<\u002Fh2>\n<div style=\"display: flex; gap: 8px; align-items: center; margin-bottom: 18px\"><img class=\"ava-s\" src=\"90fa9727-4507-4fe5-90d6-88e4c3138f99\" alt=\"\"><img class=\"ava-s\" src=\"c8c40f7b-13dc-4354-a272-5b9be508255e\" alt=\"\" style=\"margin-left: -16px\"><span class=\"small\">Abi y Charlie<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px\">\n<div class=\"card\">\n<h3 class=\"h3\" style=\"color: #B547C5\">Antes<\u002Fh3>\n<label class=\"check\"><input type=\"checkbox\">Mientras acomodamos los materiales, mesas, pegamos flyers, etc.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Cómo se ven las mesas con los materiales (closeup).<\u002Flabel>\n<\u002Fdiv>\n<div class=\"card\">\n<h3 class=\"h3\" style=\"color: #B547C5\">Durante<\u002Fh3>\n<label class=\"check\"><input type=\"checkbox\">Llegada de los invitados (cuando entran a la sala, se colocan sus nombres y cuando el staff los lleva a su lugar).<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Mike mientras habla con los participantes.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Entrevista a los participantes de la expectativa que tienen del taller.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Fotos de arranque del taller.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Clips o fotos a moderadores mientras presentan.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Clips o fotos durante las actividades.<\u002Flabel>\n<\u002Fdiv>\n<div class=\"card\">\n<h3 class=\"h3\" style=\"color: #B547C5\">Después<\u002Fh3>\n<label class=\"check\"><input type=\"checkbox\">Entrevista a los participantes de cómo les pareció el taller.<\u002Flabel>\n<label class=\"check\"><input type=\"checkbox\">Mientras contestan el QR para calificar el taller.<\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"margin-top: 56px; padding-top: 24px; border-top: 1px solid #EEEEEE; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span class=\"small\">Workshop El Combo del Diseño · Universidad de la Libertad, Piso 3 · Sala 13<\u002Fspan>\n<img src=\"f9bc03fe-3793-4004-aca8-286b00b4cd4e\" alt=\"UiX\" style=\"height: 32px; width: auto\">\n<\u002Ffooter>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#001E5A&quot;,&quot;options&quot;:[&quot;#001E5A&quot;,&quot;#7B3FE4&quot;,&quot;#1F7A4D&quot;,&quot;#1A1A1A&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:11000}}\">\nconst CRONO_ITEMS = [\n{ k: 'k1', nombre: 'Recepción y bienvenida', tipo: 'act', i: 0, d: 10, c: 0 },\n{ k: 'k2', nombre: 'Bienvenida y arranque del workshop', tipo: 'act', i: 0, d: 6, c: 0 },\n{ k: 'k3', nombre: 'Act. 0 · Icebreaker', tipo: 'act', i: 2, d: 10, c: 0 },\n{ k: 'k4', nombre: 'Act. 1 · Creemos la base de la fórmula secreta', tipo: 'act', i: 2, d: 26, c: 2 },\n{ k: 'k5', nombre: 'Act. 2 · Exploremos los laboratorios', tipo: 'act', i: 2, d: 25, c: 2 },\n{ k: 'k6', nombre: 'Break 1 · Catering', tipo: 'break', i: 0, d: 10, c: 0 },\n{ k: 'k7', nombre: 'Act. 3 · Creemos la fórmula', tipo: 'act', i: 2, d: 45, c: 2 },\n{ k: 'k8', nombre: 'Break 2 · Catering', tipo: 'break', i: 0, d: 10, c: 0 },\n{ k: 'k9', nombre: 'Act. 4 · Conceptualicemos la receta de la fórmula', tipo: 'act', i: 2, d: 20, c: 2 },\n{ k: 'k10', nombre: 'Act. 5 · Patentemos la fórmula', tipo: 'act', i: 2, d: 20, c: 2 },\n{ k: 'k11', nombre: 'Act. 6 · Cierre, conclusiones y siguientes pasos', tipo: 'act', i: 0, d: 5, c: 0 }\n];\nconst CRONO_INICIO = '09:50';\nfunction toMin(hhmm) { const m = /^(\\d{1,2}):(\\d{2})/.exec(String(hhmm || '')); return m ? (+m[1]) * 60 + (+m[2]) : 590; }\nfunction fmtHora(t) { t = ((t % 1440) + 1440) % 1440; const h = Math.floor(t / 60), m = t % 60; const h12 = h % 12 === 0 ? 12 : h % 12; return h12 + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? ' am' : ' pm'); }\nfunction fmtDur(n) { const h = Math.floor(n / 60), m = n % 60; return h ? (h + ' h ' + (m ? m + ' min' : '')).trim() : m + ' min'; }\nfunction nonNeg(v) { const n = parseInt(v, 10); return isNaN(n) || n < 0 ? 0 : Math.min(n, 600); }\n\nclass Component extends DCLogic {\nconstructor(props) {\nsuper(props);\nthis.state = { cfg: null, cronoMsg: '', cronoMsgColor: '#1F6B12' };\nthis.db = null; this.unsub = null; this.saveT = null;\n}\ncomponentDidMount() {\nthis._alive = true;\nconst c = typeof window !== 'undefined' ? window.claude : null;\nif (!c || typeof c.use !== 'function') return;\nc.use('db').then((db) => {\nif (!this._alive || !db) return;\nthis.db = db;\ntry {\nthis.unsub = db.doc('config/cronograma').onSnapshot((d) => {\nconst v = d && d.data ? d.data() : null;\nif (this._alive && v && !this.saveT) this.setState({ cfg: v });\n}, () => {});\n} catch (e) {}\n}).catch(() => {});\n}\ncomponentWillUnmount() { this._alive = false; if (this.unsub) { try { this.unsub(); } catch (e) {} } if (this.saveT) clearTimeout(this.saveT); }\ncfg() {\nconst v = this.state.cfg || {};\nconst items = {};\nCRONO_ITEMS.forEach(function (it) {\nconst o = (v.items && v.items[it.k]) || {};\nitems[it.k] = { i: o.i != null ? nonNeg(o.i) : it.i, d: o.d != null ? nonNeg(o.d) : it.d, c: o.c != null ? nonNeg(o.c) : it.c };\n});\nreturn { inicio: v.inicio || CRONO_INICIO, items: items };\n}\nupdate(fn) {\nconst next = this.cfg(); fn(next);\nthis.setState({ cfg: next, cronoMsg: '' });\nif (this.saveT) clearTimeout(this.saveT);\nthis.saveT = setTimeout(() => {\nthis.saveT = null;\nif (!this.db) { this.setState({ cronoMsg: 'Los cambios no se pudieron guardar (sin conexión).', cronoMsgColor: '#8F1219' }); return; }\nthis.db.doc('config/cronograma').set(this.cfg()).then(() => {\nthis.setState({ cronoMsg: 'Tiempos guardados.', cronoMsgColor: '#1F6B12' });\n}).catch(() => {\nthis.setState({ cronoMsg: 'No se pudo guardar. Necesitas permiso de edición en esta guía.', cronoMsgColor: '#8F1219' });\n});\n}, 700);\n}\nrenderVals() {\nconst cfg = this.cfg();\nconst val = (e) => (e && e.target ? e.target.value : '');\nlet t = toMin(cfg.inicio);\nconst start = t;\nconst tt = {}, dur = {}, mins = {};\nconst ed = {};\nconst openK = this.state.openK || '';\nCRONO_ITEMS.forEach((it) => {\nconst v = cfg.items[it.k];\nconst isBreak = it.tipo === 'break';\nconst total = isBreak ? v.d : v.i + v.d + v.c;\nconst ini = t; t += total;\ntt[it.k] = fmtHora(ini) + ' – ' + fmtHora(t);\nmins[it.k] = total;\nconst parts = [];\nif (!isBreak) {\nif (v.i) parts.push(v.i + ' min instrucciones');\nif (v.d) parts.push(v.d + ' min desarrollo');\nif (v.c) parts.push(v.c + ' min cierre');\n}\ndur[it.k] = parts.length ? parts.join(' · ') : total + ' min';\ned[it.k] = {\nopen: openK === it.k, i: v.i, d: v.d, c: v.c,\ntoggle: () => this.setState({ openK: this.state.openK === it.k ? '' : it.k }),\nonI: (e) => this.update((c) => { c.items[it.k].i = nonNeg(val(e)); }),\nonD: (e) => this.update((c) => { c.items[it.k].d = nonNeg(val(e)); }),\nonC: (e) => this.update((c) => { c.items[it.k].c = nonNeg(val(e)); })\n};\n});\nreturn {\naccent: this.props.accent ?? '#001E5A',\ned: ed, t: tt, dur: dur, min: mins,\ninicio: cfg.inicio, inicioTxt: fmtHora(start), finTxt: fmtHora(t), totalTxt: fmtDur(t - start),\nonInicio: (e) => { const v = val(e); if (/^\\d{1,2}:\\d{2}$/.test(v)) this.update((c) => { c.inicio = v; }); },\ncronoMsg: this.state.cronoMsg, hasCronoMsg: !!this.state.cronoMsg, cronoMsgColor: this.state.cronoMsgColor\n};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
